# P7 — CI de distribuicao do opencode-orchestration.
#
# Impede regressoes de distribuicao: validacao estatica do pacote, suites V3
# e exercicio real de install/uninstall num home isolado
# ($RUNNER_TEMP\oo-home), cobrindo fresh install, idempotencia, preservacao
# de config do usuario, rollback transacional e uninstall ownership-only.
#
# NOTA plugin dep (best-effort, runtime): install.ps1 instala @opencode-ai/plugin via
# bun/npm FORA da transacao e fora do rollback (efeito externo): se bun/npm
# estiverem ausentes ou a rede falhar, o install emite AVISO e sai 0 — nunca
# aborta. Essa tolerancia e do install.ps1 em runtime, nao do CI.
#
# Gate plugin-enforcement (obrigatorio no CI): bun e provisionado via npm
# (pacote oficial mantido pela Oven) em ambos os jobs antes das distribution
# suites; a suite plugin-enforcement.tests.ps1 falha (NOT OK + exit 1) se bun
# estiver ausente - nao ha mais skip condicional de bun no CI. O harness usa
# import type (apagado em runtime), por isso o CI nao asserta node_modules
# nem depende de rede de plugin fora do provisionamento de bun.
#
# Sem segredos. Nenhuma acao de terceiros alem de actions/checkout.
# Badge padrao do GitHub Actions (badge-able): actions/workflows/ci.yml/badge.svg.
# Dois jobs explicitos (ci-ps51/ci-ps7) em vez de matriz: steps.shell NAO
# aceita contexts/expressoes (actionlint). Pipeline: package consistency ->
# V3 suites (scripts/v3/run-v3-tests.ps1) -> distribution suites
# (tests/distribution/run-distribution-tests.ps1, PS 5.1-compativel); cada
# job exercita as distribution suites no proprio engine (ps51/pwsh).

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci-ps51:
    name: CI (ps51)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static/package validation
        run: powershell -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/test-package-consistency.ps1

      - name: V3 test suite (~5-6 min)
        timeout-minutes: 20
        run: powershell -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/v3/run-v3-tests.ps1

      - name: Provision bun (official npm package)
        run: npm install -g bun; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; bun --version

      - name: Distribution suites (9 suites, install transacional)
        run: powershell -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests/distribution/run-distribution-tests.ps1

  ci-ps7:
    name: CI (ps7)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static/package validation
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/test-package-consistency.ps1

      - name: V3 test suite (~5-6 min)
        timeout-minutes: 20
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/v3/run-v3-tests.ps1

      - name: Provision bun (official npm package)
        run: npm install -g bun; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; bun --version

      - name: Distribution suites (9 suites, install transacional)
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests/distribution/run-distribution-tests.ps1
