# P7 — CI de distribuicao do opencode-orchestration.
#
# Impede regressoes de distribuicao: validacao estatica do pacote, suites V3
# e exercicio real de install/uninstall num home isolado
# ($RUNNER_TEMP\oo-home), cobrindo fresh install, idempotencia, preservacao
# de config do usuario, rollback transacional e uninstall ownership-only.
#
# NOTA plugin dep (best-effort, runtime): install.ps1 instala @opencode-ai/plugin via
# bun/npm FORA da transacao e fora do rollback (efeito externo): se bun/npm
# estiverem ausentes ou a rede falhar, o install emite AVISO e sai 0 — nunca
# aborta. Essa tolerancia e do install.ps1 em runtime, nao do CI.
#
# Gate plugin-enforcement (obrigatorio no CI): bun e provisionado via npm
# (pacote oficial mantido pela Oven) em todos os jobs que executam as suites V3/
# distribution, antes delas (plugin-dual-runtime.tests.ps1 roda dentro da V3
# suite e falha sem bun); a suite plugin-enforcement.tests.ps1 falha (NOT OK +
# exit 1) se bun estiver ausente - nao ha mais skip condicional de bun no CI.
# O job ci-smoke-opencode-v2 nao usa bun. O harness usa
# import type (apagado em runtime), por isso o CI nao asserta node_modules
# nem depende de rede de plugin fora do provisionamento de bun.
#
# Sem segredos. Nenhuma acao de terceiros alem de actions/checkout.
# Politica de pinning (reprodutibilidade): actions por SHA com comentario da
# versao (ex.: actions/checkout@<sha> # v4.2.2). TODOS os pins de pacote
# (opencode V1, opencode V2, plugins V1/V2, bun) vivem em UM registry
# commitado: source/registry/runtime-versions.json. Cada job que instala le
# esse arquivo no passo "Resolve pinned versions" e exporta as specs por
# GITHUB_ENV; nenhuma versao de pacote e digitada neste workflow. Bump de
# versao = edicao do registry + re-validacao no runtime exato.
# Tres jobs: ci-ps51/ci-ps7 (suites V3 + distribution, engines ps51/pwsh),
# ci-smoke-opencode (OpenCode V1 REAL num home isolado + typecheck do plugin
# contra a API real, pin do registry) e ci-v2-lane (package
# consistency + V3 + distribution + typecheck V1/V2/dual COM o perfil V2 pinado
# (pin do registry) provisionado antes das distribution suites: a suite
# live-hook-v2.tests.ps1 resolve o binario de forma portavel em
# %USERPROFILE%\.opencode-orchestration\profiles\v2\runtime\node_modules\@opencode\cli\bin\opencode.exe
# e tem GATE bloqueante de versao exata por design (RR-P24-REV-FIX HIGH), que
# NUNCA vira skip. O exercicio do binario V2 real de servico gerenciado vive no
# job ci-smoke-opencode-v2, que roda o smoke de ciclo de vida explicito
# (scripts/ci/smoke-opencode-v2-lifecycle.ps1, padrao P22, 3/3 PASS local em
# 2026-10-03; primeira execucao real no runner so ocorre no push).
# Badge padrao do GitHub Actions (badge-able): actions/workflows/ci.yml/badge.svg.
# Tres jobs explicitos (ci-ps51/ci-ps7/smoke) mais a lane ci-v2-lane em vez de
# matriz: steps.shell NAO aceita contexts/expressoes (actionlint). Pipeline: package consistency ->
# V3 suites (scripts/v3/run-v3-tests.ps1) -> distribution suites
# (tests/distribution/run-distribution-tests.ps1, PS 5.1-compativel); cada
# job exercita as distribution suites no proprio engine (ps51/pwsh).
# Job ci-smoke-opencode-v2 (Phase 8): OpenCode V2 REAL (spec do registry via
# npm + postinstall oficial) num home isolado ($RUNNER_TEMP\oo-v2smoke-home
# e $RUNNER_TEMP\oo-v2lifecycle-<run-id>). Ordem deliberada: PRIMEIRO o smoke de
# ciclo de vida EXPLICITO do servico gerenciado (service set port -> start ->
# status -> stop owned -> settlement; sem `debug config`), path estavel do padrao
# P22, que produz evidencia; DEPOIS o smoke implicito (debug paths/config/agents,
# plugin list, mcp list), mantido como probe honesto do comportamento upstream
# flaky conhecido (7 hangs vs 5 passes no binario pinado em 2.0.18 no mesmo dia;
# debugcfg-hang-investigation.json): nao removido nem alterado. Config com os 19
# workers via AgentTranslator + servidor privado (service set port) em ambos.
# Mandatorio (exit 1 em runtime ausente/errado, load ou timeout; nunca skip
# silencioso).
#
# Contaminacao do working tree neste job (RR-E2E-04 / COMPLETION_GATE_FAILED):
# a evidencia do smoke de lifecycle e' EFEMERA por default
# ($RUNNER_TEMP\oo-v2lifecycle-evidence\..., fora do checkout; persistente
# apenas com -EvidencePath explicito), entao o working tree chega LIMPO a lane
# real. Antes, o default escrevia em
# evidence/v3.1/kernel-hardening/v2-ci-smoke-lifecycle.json (TRACKED) e essa
# modificacao fora do write scope da lane fazia o scope check do cenario 04
# responder skipped-out-of-scope => verified_pass=false =>
# COMPLETION_GATE_FAILED. A lane real agora tem, ademais, um gate INICIAL
# fail-closed de arvore limpa (clean_tree_within_lane_scopes: mesmo
# Test-OrchestrationWriteScope e mesmos write scopes do cenario 04, untracked
# contando) que bloqueia ANTES de qualquer cenario, com os paths
# contaminantes no artefato, se um step anterior deixar o checkout sujo. Steps,
# ordem, timeouts e conjunto de acoes seguem inalterados.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci-ps51:
    name: CI (ps51)
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Static/package validation
        run: powershell -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/test-package-consistency.ps1

      - name: Resolve pinned versions (registry = source/registry/runtime-versions.json)
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/runtime/lib/RuntimeVersions.ps1
          $pins = @(
            @('V1_SPEC', (Get-OrchestrationRuntimeVersion -Name v1).spec),
            @('V2_SPEC', (Get-OrchestrationRuntimeVersion -Name v2).spec),
            @('PLUGIN_V1_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v1).spec),
            @('PLUGIN_V2_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v2).spec),
            @('BUN_VERSION', (Get-OrchestrationRuntimeVersion -Name bun).version)
          )
          foreach ($kv in $pins) {
            if ([string]::IsNullOrWhiteSpace([string]$kv[1])) { throw ('pin ausente apos o loader: ' + $kv[0]) }
            ('{0}={1}' -f $kv[0], [string]$kv[1]) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host ('[pin] ' + $kv[0] + '=' + $kv[1])
          }

      - name: Provision bun (official npm package)
        run: npm install -g "bun@$env:BUN_VERSION"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; bun --version

      - name: V3 test suite (~5-6 min local; runner exige mais)
        timeout-minutes: 40
        run: powershell -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/v3/run-v3-tests.ps1

      - name: Provision OpenCode V2 profile (pinned, official npm package)
        run: powershell -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/runtime/new-opencode-profile.ps1 -RuntimeId opencode-v2 -ProvisionRuntime

      - name: Distribution suites (13 suites, install transacional)
        run: powershell -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests/distribution/run-distribution-tests.ps1

  ci-ps7:
    name: CI (ps7)
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Static/package validation
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/test-package-consistency.ps1

      - name: Resolve pinned versions (registry = source/registry/runtime-versions.json)
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/runtime/lib/RuntimeVersions.ps1
          $pins = @(
            @('V1_SPEC', (Get-OrchestrationRuntimeVersion -Name v1).spec),
            @('V2_SPEC', (Get-OrchestrationRuntimeVersion -Name v2).spec),
            @('PLUGIN_V1_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v1).spec),
            @('PLUGIN_V2_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v2).spec),
            @('BUN_VERSION', (Get-OrchestrationRuntimeVersion -Name bun).version)
          )
          foreach ($kv in $pins) {
            if ([string]::IsNullOrWhiteSpace([string]$kv[1])) { throw ('pin ausente apos o loader: ' + $kv[0]) }
            ('{0}={1}' -f $kv[0], [string]$kv[1]) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host ('[pin] ' + $kv[0] + '=' + $kv[1])
          }

      - name: Provision bun (official npm package)
        run: npm install -g "bun@$env:BUN_VERSION"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; bun --version

      - name: V3 test suite (~5-6 min local; runner exige mais)
        timeout-minutes: 40
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/v3/run-v3-tests.ps1

      - name: Provision OpenCode V2 profile (pinned, official npm package)
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/runtime/new-opencode-profile.ps1 -RuntimeId opencode-v2 -ProvisionRuntime

      - name: Distribution suites (13 suites, install transacional)
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests/distribution/run-distribution-tests.ps1

  ci-smoke-opencode:
    name: CI (smoke opencode real)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve pinned versions (registry = source/registry/runtime-versions.json)
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/runtime/lib/RuntimeVersions.ps1
          $pins = @(
            @('V1_SPEC', (Get-OrchestrationRuntimeVersion -Name v1).spec),
            @('V2_SPEC', (Get-OrchestrationRuntimeVersion -Name v2).spec),
            @('PLUGIN_V1_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v1).spec),
            @('PLUGIN_V2_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v2).spec),
            @('BUN_VERSION', (Get-OrchestrationRuntimeVersion -Name bun).version)
          )
          foreach ($kv in $pins) {
            if ([string]::IsNullOrWhiteSpace([string]$kv[1])) { throw ('pin ausente apos o loader: ' + $kv[0]) }
            ('{0}={1}' -f $kv[0], [string]$kv[1]) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host ('[pin] ' + $kv[0] + '=' + $kv[1])
          }

      - name: Provision bun (official npm package, pinned)
        run: npm install -g "bun@$env:BUN_VERSION"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; bun --version

      - name: Install OpenCode V1 (pinned)
        run: npm install -g "$env:V1_SPEC"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; opencode --version

      - name: Smoke test with real OpenCode (isolated home)
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/ci/smoke-opencode.ps1

      - name: Typecheck plugin against real API
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/ci/typecheck-plugin.ps1

  ci-v2-lane:
    name: CI (v2 lane, perfil V2 provisionado)
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Static/package validation
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/test-package-consistency.ps1

      - name: Resolve pinned versions (registry = source/registry/runtime-versions.json)
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/runtime/lib/RuntimeVersions.ps1
          $pins = @(
            @('V1_SPEC', (Get-OrchestrationRuntimeVersion -Name v1).spec),
            @('V2_SPEC', (Get-OrchestrationRuntimeVersion -Name v2).spec),
            @('PLUGIN_V1_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v1).spec),
            @('PLUGIN_V2_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v2).spec),
            @('BUN_VERSION', (Get-OrchestrationRuntimeVersion -Name bun).version)
          )
          foreach ($kv in $pins) {
            if ([string]::IsNullOrWhiteSpace([string]$kv[1])) { throw ('pin ausente apos o loader: ' + $kv[0]) }
            ('{0}={1}' -f $kv[0], [string]$kv[1]) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host ('[pin] ' + $kv[0] + '=' + $kv[1])
          }

      - name: Provision bun (official npm package, pinned)
        run: npm install -g "bun@$env:BUN_VERSION"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; bun --version

      - name: V3 test suite (~5-6 min local; runner exige mais)
        timeout-minutes: 40
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/v3/run-v3-tests.ps1

      - name: Provision OpenCode V2 profile (pinned, official npm package)
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/runtime/new-opencode-profile.ps1 -RuntimeId opencode-v2 -ProvisionRuntime

      - name: Distribution suites (13 suites, install transacional)
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests/distribution/run-distribution-tests.ps1

      - name: Plugin typecheck V1/V2/dual
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/ci/typecheck-plugin.ps1

  ci-smoke-opencode-v2:
    name: CI (smoke opencode v2 real)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve pinned versions (registry = source/registry/runtime-versions.json)
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/runtime/lib/RuntimeVersions.ps1
          $pins = @(
            @('V1_SPEC', (Get-OrchestrationRuntimeVersion -Name v1).spec),
            @('V2_SPEC', (Get-OrchestrationRuntimeVersion -Name v2).spec),
            @('PLUGIN_V1_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v1).spec),
            @('PLUGIN_V2_SPEC', (Get-OrchestrationRuntimeVersion -Name plugin_v2).spec),
            @('BUN_VERSION', (Get-OrchestrationRuntimeVersion -Name bun).version)
          )
          foreach ($kv in $pins) {
            if ([string]::IsNullOrWhiteSpace([string]$kv[1])) { throw ('pin ausente apos o loader: ' + $kv[0]) }
            ('{0}={1}' -f $kv[0], [string]$kv[1]) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host ('[pin] ' + $kv[0] + '=' + $kv[1])
          }

      - name: Install OpenCode V2 (pinned, official npm package)
        run: npm install -g "$env:V2_SPEC"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; opencode --version

      # Evidencia EFEMERA por default ($RUNNER_TEMP, fora do checkout): este
      # step nao pode sujar o working tree, senao a lane real abaixo bloqueia no
      # gate inicial de arvore limpa.
      - name: Smoke lifecycle explicito do servico V2 (padrao P22, path comprovado local 2026-10-03)
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/ci/smoke-opencode-v2-lifecycle.ps1

      # Gate inicial fail-closed de arvore limpa dentro dos write scopes da lane
      # (mesmo scope check do cenario 04): bloqueia antes de qualquer cenario se
      # um step anterior contaminar o checkout.
      - name: Lane real dos cenarios RR-E2E-04..10 (watchdog + kernel, processos reais)
        timeout-minutes: 10
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/ci/watchdog-real-lane-v2.ps1

      - name: Smoke test with real OpenCode V2 (isolated home, private server)
        run: pwsh -NoProfile -NoLogo -ExecutionPolicy Bypass -File scripts/ci/smoke-opencode-v2.ps1
